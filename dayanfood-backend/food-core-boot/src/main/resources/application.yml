spring:
  config:
    import: classpath:backend-defaults.yml
---
spring:
  application:
    name: food-core
  flyway:
    enabled: true
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8081}
app:
  media:
    serve-uploads: false
    core-url: ${CORE_SERVICE_URL:http://127.0.0.1:8081}
