spring:
  config:
    import: classpath:backend-defaults.yml
---
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: food-media
  flyway:
    enabled: false
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8082}
app:
  user-service:
    remote: true
    url: ${USER_SERVICE_URL:http://127.0.0.1:8083}
    token: ${USER_SERVICE_TOKEN}
  media:
    serve-uploads: true
    core-url: ${CORE_SERVICE_URL:http://127.0.0.1:8081}
