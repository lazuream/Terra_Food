name: ${COMPOSE_PROJECT_NAME:-terrafood-perf}

services:
  mysql:
    image: mysql:8.4
    mem_limit: 768m
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=268435456
      - --max-connections=30
    environment:
      MYSQL_ROOT_PASSWORD: ${PERF_DB_PASSWORD:?set PERF_DB_PASSWORD}
      MYSQL_DATABASE: dayan_food
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    mem_limit: 128m
    command: ["redis-server", "--save", "", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: performance/Dockerfile.backend
    mem_limit: 768m
    environment:
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx384m -XX:+UseSerialGC
      DB_URL: jdbc:mysql://mysql:3306/dayan_food?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${PERF_DB_PASSWORD:?set PERF_DB_PASSWORD}
      REDIS_HOST: redis
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 8
      INITIAL_ADMIN_ENABLED: "true"
      INITIAL_ADMIN_USERNAME: perf_admin
      INITIAL_ADMIN_PASSWORD: ${PERF_ADMIN_PASSWORD:?set PERF_ADMIN_PASSWORD}
      SESSION_COOKIE_SECURE: "false"
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${PERF_PORT:-18280}
      UPLOAD_DIRECTORY: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/api/foods/catalog?page=1&pageSize=1&compact=true >/dev/null"]
      interval: 5s
      timeout: 4s
      retries: 40

  web:
    build:
      context: ..
      dockerfile: performance/Dockerfile.web
    mem_limit: 64m
    ports:
      - "127.0.0.1:${PERF_PORT:-18280}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql-data:
  uploads:
