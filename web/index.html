<!doctype html>
<html lang="zh-CN">

  <head>
    <script>try{const t=localStorage.getItem('terra-food.theme');const d=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.dataset.theme=d?'dark':'light';document.documentElement.style.colorScheme=d?'dark':'light'}catch{}</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#781f1f">
    <title>大炎珍馐志</title>
</head>

<body>
    <div id="startup-shell" role="status">
      <strong>大炎珍馐志</strong>
      <span>正在打开珍馐地图…</span>
      <noscript>请启用 JavaScript 后继续使用。</noscript>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <style>
      #startup-shell{position:fixed;inset:0;display:grid;place-content:center;gap:12px;text-align:center;background:#f5f0e5;color:#4b2621;font-family:STSong,SimSun,serif;z-index:9999}
      #startup-shell strong{font-size:clamp(24px,5vw,42px)}
      html[data-route-load-failed=true] #startup-shell span::after{content:' 页面资源加载失败，请刷新重试。';display:block;margin-top:12px;color:#8a2424}
    </style>
</body>

</html>
