name: terra-food-services
x-backend-env: &backend-env
  USER_SERVICE_URL: http://user:8083
  USER_SERVICE_TOKEN: ${USER_SERVICE_TOKEN:?Configure a random shared service token of at least 32 characters}
  DB_URL: ${DB_URL:?Configure an existing MySQL database URL}
  DB_USERNAME: ${DB_USERNAME:?Configure database user}
  DB_PASSWORD: ${DB_PASSWORD:?Configure database password}
  REDIS_HOST: ${REDIS_HOST:?Configure Redis host}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Configure Redis password}
  SPRING_PROFILES_ACTIVE: prod
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
  SERVER_ADDRESS: 0.0.0.0
  TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.30.92.0/24}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}

services:
  core:
    build:
      context: ../..
      dockerfile: ops/Dockerfile.services
      target: core
    environment:
      <<: *backend-env
      SERVER_PORT: 8081
      AGENT_SERVICE_URL: ${AGENT_SERVICE_URL:-http://agent:8090}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:-}
      MCP_BACKEND_TOKEN: ${MCP_BACKEND_TOKEN:-}
      AGENT_CONTEXT_SECRET: ${AGENT_CONTEXT_SECRET:-}
    restart: unless-stopped
  user:
    build:
      context: ../..
      dockerfile: ops/Dockerfile.services
      target: user
    environment:
      <<: *backend-env
      SERVER_PORT: 8083
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped
  media:
    build:
      context: ../..
      dockerfile: ops/Dockerfile.services
      target: media
    environment:
      <<: *backend-env
      SERVER_PORT: 8082
      CORE_SERVICE_URL: http://core:8081
      UPLOAD_DIRECTORY: /data/uploads
    volumes:
      - ${UPLOAD_DIRECTORY:?Use the existing absolute upload directory}:/data/uploads
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped
  gateway:
    build:
      context: ../..
      dockerfile: ops/Dockerfile.services
      target: gateway
    environment:
      GATEWAY_PORT: 8080
      CORE_SERVICE_URL: http://core:8081
      MEDIA_SERVICE_URL: http://media:8082
      USER_SERVICE_URL: http://user:8083
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      - core
      - media
      - user
    restart: unless-stopped
networks:
  default:
    ipam:
      config:
        - subnet: ${SERVICE_SUBNET:-172.30.92.0/24}
